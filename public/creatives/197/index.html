<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <meta name="ad.size" content="width=320,height=50">
  <title>Gudang Murah - Rich Media Banner 320x50 (flash sale)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="banner" id="banner" aria-label="Iklan Gudang Murah">

    <div class="msg">
      <b>Flash sale</b>
      <small id="note">diskon sampai 70%</small>
    </div>

    <div class="timer" role="timer" aria-label="Sisa waktu flash sale">
      <span id="hh">00</span><i>:</i><span id="mm">00</span><i>:</i><span id="ss">00</span>
    </div>

    <button type="button" class="bell" id="bell" aria-pressed="false" aria-label="Ingatkan saya">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M12 3a6 6 0 0 0-6 6v3.4L4.3 16a1 1 0 0 0 .9 1.5h13.6a1 1 0 0 0 .9-1.5L18 12.4V9a6 6 0 0 0-6-6zm-2 16a2 2 0 0 0 4 0z" fill="currentColor"/>
      </svg>
    </button>

    <button type="button" class="cta" id="cta">Cek</button>

    <span class="legal">contoh materi iklan</span>
  </main>

  <script src="script.js"></script>
</body>
</html>
