<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=728, initial-scale=1">
  <meta name="ad.size" content="width=728,height=90">
  <title>SMA Cendekia Nusa - Rich Media Banner 728x90 (sekolah)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="banner" id="banner" aria-label="Iklan SMA Cendekia Nusa">

    <span class="margin" aria-hidden="true"></span>

    <div class="brand">
      <span class="logo"><i class="pencil" aria-hidden="true"></i>SMA Cendekia Nusa</span>
      <h1>Pendaftaran <mark>siswa baru</mark> dibuka</h1>
      <p>Tahun ajaran 2027/2028</p>
    </div>

    <div class="quiz" id="quiz">
      <p class="q">Kuis cepat: <b id="question">7 × 8 = ?</b></p>
      <div class="answers" id="answers" role="group" aria-label="Pilih jawaban"></div>
      <p class="feedback" id="feedback" role="status">Jawab benar, dapat potongan biaya pendaftaran.</p>
    </div>

    <div class="side">
      <button type="button" class="cta" id="cta">Daftar sekarang</button>
      <button type="button" class="again" id="again" hidden>soal baru</button>
    </div>

    <span class="legal">contoh materi iklan</span>
  </main>

  <script src="script.js"></script>
</body>
</html>
