<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=970, initial-scale=1">
  <meta name="ad.size" content="width=970,height=250">
  <title>Neodeeps - Rich Media Banner 970x250</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="banner" id="banner" aria-label="Iklan Neodeeps">

    <section class="left">
      <span class="logo"><i class="dot" aria-hidden="true"></i>neodeeps</span>
      <h1>Temukan komunitas dan event yang pas buatmu.</h1>
      <p>Cari acara, lalu gabung komunitasnya.</p>
      <button type="button" class="cta" id="cta">Jelajahi di neodeeps.com</button>
    </section>

    <section class="right">
      <div class="chips" id="chips" role="group" aria-label="Pilih minat">
        <span class="chips-label">Pilih minat</span>
        <button type="button" class="chip" data-minat="teknologi" aria-pressed="true">Teknologi</button>
        <button type="button" class="chip" data-minat="desain" aria-pressed="false">Desain</button>
        <button type="button" class="chip" data-minat="musik" aria-pressed="false">Musik</button>
        <button type="button" class="chip" data-minat="olahraga" aria-pressed="false">Olahraga</button>
        <button type="button" class="chip" data-minat="kuliner" aria-pressed="false">Kuliner</button>
      </div>

      <div class="cards" id="cards" aria-live="polite"></div>

      <p class="note">Contoh acara untuk ilustrasi. Klik kartu untuk membuka neodeeps.com.</p>
    </section>

    <span class="legal">contoh materi iklan</span>
  </main>

  <script src="script.js"></script>
</body>
</html>
