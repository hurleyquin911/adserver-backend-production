<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ad.size" content="width=320,height=480">
  <meta name="referrer" content="no-referrer">
  <title>Actifed — Konsultasi Batuk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="banner" data-phase="chat" aria-label="Konsultasi Batuk Actifed">
  <img class="full backdrop" src="images/bg-green.png" alt="">
  <div id="chat-backdrop" class="full"></div>
  <img class="full brand" src="images/base.png" alt="Haleon. Actifed. Halal Indonesia. Baru, kini terjangkau, kemasan 25 ml. Baca aturan pakai. Jika sakit berlanjut hubungi dokter. Dapat menyebabkan kantuk.">
  <div id="brand-header"><img src="images/ui-atas.png" alt="Haleon, Actifed, Halal Indonesia"></div>

  <section id="consultation" aria-label="Percakapan konsultasi">
    <header class="chat-heading">
      <span class="assistant-mark" aria-hidden="true">A</span>
      <span id="chat-title">Konsultasi Batuk</span>
      <span id="progress" aria-label="Pertanyaan 1 dari 3">1 / 3</span>
    </header>
    <div id="messages" role="log" aria-label="Riwayat percakapan" aria-live="polite" aria-relevant="additions text" tabindex="0"></div>
    <div id="composer" role="group" aria-label="Pilih dan kirim jawaban">
      <fieldset id="choices"><legend class="sr-only">Pilih jawaban</legend></fieldset>
      <div class="input-row">
        <input id="message-input" type="text" readonly inputmode="none" tabindex="-1" autocomplete="off" aria-label="Pesan terpilih, tidak dapat diedit" placeholder="Pilih jawaban di atas…">
        <button id="send" type="button" aria-label="Kirim jawaban" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 9-18 9 3-9-3-9Zm3 9h15"/></svg>
        </button>
      </div>
    </div>
    <section id="result-panel" aria-label="Hasil konsultasi" tabindex="-1" hidden>
      <div id="result-copy"></div>
    </section>
  </section>
  <small id="disclaimer">Hasil berdasarkan jawabanmu dan bukan diagnosis medis.<br>Baca aturan pakai pada kemasan.</small>

  <section id="product-scene" aria-label="Produk Actifed" aria-hidden="true" hidden>
    <img id="main-copy" src="images/main-copy.png" alt="Cepat redakan batuk membandel dan gejala pilek dengan Actifed Plus Cough Suppressant">
    <img id="product-green" class="product" src="images/actifed-green.png" alt="Actifed Plus Expectorant, batuk berdahak" aria-hidden="true">
    <img id="product-red" class="product" src="images/actifed-red.png" alt="Actifed Plus Cough Suppressant, batuk kering" aria-hidden="true">
    <img id="product-cta" src="images/cta.png" alt="Pesan sekarang!">
  </section>

  <a id="exit-top" class="exit-zone" data-exit="header" href="#" target="_blank" rel="noopener noreferrer" aria-label="Lihat Actifed di Halodoc"></a>
  <a id="exit-bottom" class="exit-zone" data-exit="footer" href="#" target="_blank" rel="noopener noreferrer" aria-label="Pesan Actifed di Halodoc"></a>
  <a id="exit-product" class="exit-zone" data-exit="product" href="#" target="_blank" rel="noopener noreferrer" aria-label="Pesan Actifed di Halodoc" hidden></a>
  <noscript><div class="no-script">Aktifkan JavaScript untuk mencoba konsultasi batuk Actifed.</div></noscript>
</main>
<script src="banner.js"></script>
</body>
</html>
